assets:
  # ---------------- o que o app usa hoje ----------------
  - id: cortex_glb
    arquivo: "dados_brainder/cortex.glb"
    estrutura: "Córtex cerebral por região Desikan-Killiany (33 itens: giros, ínsula, parede medial) e malhas subcorticais (núcleos da base, tálamo, amígdala, hipocampo, ventrículos, tronco, cerebelo)"
    fonte: brain_for_blender
    processamento: >-
      Superfícies pial e inflada (Desikan-Killiany) e subcorticais do Brain for Blender; só o hemisfério esquerdo;
      decimação para 150 mil triângulos por hemisfério (meshoptimizer); mudança de eixos e escala para cm; giro de -10° em X;
      deslocamento; recoloração. O direito é o espelho do esquerdo no app. Script: scripts/converter_brainder.mjs.
    data_download: null     # não registrado na época; preencher se houver o recibo
    estruturas_ids: [cc_cut, dien_wall, gang, gbsts, gcalc, gcing, gcun, gfi_op, gfi_or, gfi_tr, gfm, gfsm, gfs, gfus, ginsula, gling, gocc, gor, gparahip, gpara, gpolof, gpos, gprec, gpre, gps, gpt, greto, gsm, gti, gtm, gts, gtt, gistmo,
      v3, v4, mesenc, ponte, bulbo, accumbens, amigdala, caudado, gpe, gpi, putame, talamo, vlat_ant, vlat_cent, vlat_post, vlat_inf, hipo_corpo, pehipo]
  - id: marcos_json
    arquivo: "dados_brainder/marcos.json"
    estrutura: "Centroides, bordas entre regiões e perfil do tronco calculados das malhas"
    fonte: brain_for_blender
    processamento: "Calculado das mesmas malhas por scripts/converter_brainder.mjs"
    data_download: null
  - id: derivados_brainder
    arquivo: null           # gerado no app, a partir de cortex.glb
    estrutura: "Lóbulos e fissuras do cerebelo, regiões da superfície do tronco (pirâmide, oliva, assoalho do IV ventrículo etc.), partes do ventrículo lateral e do hipocampo"
    fonte: brain_for_blender
    fonte_adicional: mimir
    licenca: "CC BY-SA 3.0 (derivado do Brain for Blender)"
    processamento: >-
      No app (src/js/03-cortex-cerebelo.js, 04-tronco.js, 10-*.js): refinamento e suavização do cerebelo, divisão em lóbulos
      por ângulo em volta do fastígio e marcação de regiões da superfície do tronco por posição. A divisão anatômica é autoria
      própria (Mímir), seguindo Machado, cap. 5.
    estruturas_ids: [cb_lingula, cb_central, cb_culmen, cb_declive, cb_folium, cb_tuber, cb_piramide, cb_uvula, cb_nodulo, cb_asa, cb_quadant, cb_quadpost, cb_semisup, cb_semiinf, cb_biventre, cb_tonsila, cb_floculo,
      f_precent, f_preculm, f_prima, f_posclival, f_horiz, f_prepir, f_pospir, f_postlat,
      fossaip, sulmedped, areavest, estrias, sullim, sulmedfr, eminmed, fossarom, colfac, fovsup, baseponte, sulbp, locus, sulbas, fcun, tubcun, sulantlat, sulpostlat, sulmedpost, decpir, areapostrema, obex, trighipo, tubgrac, sulintpost, fgrac, trigvago, fovinf, oliva, fismedant, piramide]
  - id: esquemas_mimir
    arquivo: null           # geometria gerada pelo código em src/js/
    estrutura: "240 itens esquemáticos: artérias, veias e seios, nervos cranianos, ramos e gânglios, núcleos dos nervos cranianos, grandes vias, corpo caloso por partes, cápsulas e claustro, fórnice, comissuras, diencéfalo, hipófise, vias ópticas, núcleos do cerebelo, núcleos e feixes internos do tronco, sistema límbico, sulcos, meninges, medula, líquor"
    fonte: mimir
    processamento: "Formas desenhadas no código (tubos, fitas, elipsoides deformados) sobre as malhas do Brain for Blender, com posição e trajeto pelo Machado e conferência no Prometheus; formas aproximadas listadas em REVISAR.md"
    data_download: null
  - id: faces_dos_cortes
    arquivo: null           # calculado no navegador
    estrutura: "Faces das bolachas (12 cortes coronais) e dos cortes transversais do tronco"
    fonte: mimir
    processamento: "Interseção das malhas do app com o plano de corte (src/js/14-bolachas.js); gabarito de níveis e nomes: Unicamp; nenhuma imagem de terceiros"
  - id: esquemas_medula
    arquivo: null
    estrutura: "Cortes esquemáticos da medula cervical, torácica e lombar"
    fonte: mimir
    processamento: "Desenho paramétrico (src/js/14-cortes-tronco.js), pelo Machado e pelas Notas de estudo do autor"
  - id: gabarito_unicamp
    arquivo: "src/js/01-gabarito.js"
    estrutura: "Lista de estruturas por face dos 12 cortes coronais"
    fonte: unicamp_gabarito
    fonte_adicional: mimir
    processamento: "Nomes transcritos das páginas da Unicamp e ligados aos ids do Mímir (gabarito/montar_gabarito.cjs)"

  # ---------------- reestruturação, Fase 1: cerebelo ----------------
  - id: cerebelo_sereno_folhas
    arquivo: "models/cerebelo_sereno_folhas.glb"
    estrutura: "Córtex cerebelar com as folhas (superfície pial do cerebmap20, os dois hemisférios e o vérmis)"
    fonte: sereno2020
    fonte_adicional: [diedrichsen2009, mimir]
    processamento: >-
      surf/rh.pial do cerebmap20 (9,2 milhões de triângulos); escala real x0,38 (0,19/0,50 mm, README e rescale2actual.tcl);
      registro de semelhança ao cerebelo do Brain for Blender (eixos principais + ICP/Umeyama; transformação e erro em
      data/processed/sereno_registro.json); FreeSurfer -> espaço do Mímir (cm); decimação quádrica para cerca de 700 mil
      triângulos (pymeshlab); compressão meshopt (gltfpack). Lóbulos: atlas SUIT
      (Diedrichsen 2009) registrado à envoltória do Sereno e passado a cada vértice pelo voxel mais próximo (índice no canal
      vermelho de COLOR_0; scripts/process/suit_cerebelo.py); nos lóbulos I-IV, verme e hemisfério pela classificação do Mímir.
      Scripts: scripts/process/sereno_cerebelo.py e scripts/process/comprimir.mjs.
    transformacao:
      descricao: "mm do cerebmap20 em escala real -> cm do Mímir (registro de semelhança ao cerebelo do Brain for Blender, depois paraAtlas e centralização na linha média do atlas, 3.5 mm em X)"
      matriz_4x4: [[-0.11993, -0.000555, 0.002838, 0.048705], [0.002875, -0.035396, 0.114588, -3.431128], [0.000308, 0.114622, 0.035399, -4.730534], [0, 0, 0, 1]]
      escala_do_registro: 1.200     # o cerebelo do Sereno (peça ex vivo) ficou 20% maior para casar com o do atlas
      erro_medio_mm: 1.36
      erro_p95_mm: 4.02
      espaco_destino: "Mímir (cm). Ainda não é o MNI ICBM152 2009c: ver docs/diagnostico_fase0.md, decisão 3"
    data_download: "2026-11-18"
  - id: cerebelo_sereno_estudo
    arquivo: "models/cerebelo_sereno_estudo.glb"
    estrutura: "Superfície lisa do cerebelo para estudo (envoltória da superfície pial, sem as folhas)"
    fonte: sereno2020
    fonte_adicional: [diedrichsen2009, mimir]
    processamento: >-
      Mesma superfície pial e mesmo registro do nível folhas; envoltória por volume: rasterização da pial em grade de 0,4 mm,
      fechamento morfológico de 1,6 mm (fecha os sulcos entre as folhas), preenchimento, gaussiana de 1 voxel, marching
      cubes (scikit-image), Taubin 15 iterações, decimação para cerca de 160 mil triângulos (pymeshlab); compressão meshopt
      (gltfpack). Script: scripts/process/sereno_cerebelo.py (função envoltoria). Lóbulos do SUIT como no nível folhas.
    data_download: "2026-11-18"
  - id: cerebelo_suit_nucleos
    arquivo: "models/cerebelo_suit_nucleos.glb"
    estrutura: "Núcleos do cerebelo: denteado, interpósito e fastigial, esquerdo e direito (compartimento mais provável do atlas SUIT)"
    fonte: diedrichsen2009
    processamento: >-
      atl-Anatom_space-MNISym_dseg.nii, rótulos 29-34; gaussiana de 0,6 voxel e marching cubes (scikit-image) por rótulo;
      MNI -> Mímir pela transformação abaixo; o fastigial é muito pequeno no mapa de compartimento mais provável (16 e 40
      triângulos). No app, aparecem nos modos do cerebelo real no lugar dos esquemas (o interpósito como item próprio). Script: scripts/process/suit_cerebelo.py.
    transformacao:
      descricao: "MNI ICBM152 2009c simétrico (mm) -> Mímir (cm): superfície do cerebelo do SUIT registrada por semelhança à envoltória do Sereno, depois paraAtlas"
      matriz_4x4: [[-0.106846, 0.000352, -0.002324, -0.004341], [-0.002309, 0.004073, 0.10677, 0.971455], [0.00044, 0.106794, -0.004064, 1.493604], [0, 0, 0, 1]]
      escala_do_registro: 1.069
      giro_graus: 7.9
      erro_medio_mm: 2.46
      erro_p95_mm: 7.45
    data_download: "2026-11-18"
  - id: massp_nucleos
    arquivo: "models/massp_nucleos.glb"
    estrutura: "Núcleos do tronco e vizinhos: substância negra, núcleo rubro, subtalâmico, colículos, corpos geniculados, área tegmentar ventral, substância cinzenta periaquedutal, pedunculopontino, habenular lateral, rafe dorsal e mediano"
    fonte: massp2
    fonte_adicional: mimir
    processamento: >-
      ahead-massp2_avg-maxlabel_decade-18to80.nii.gz (compartimento mais provável, 0,5 mm, MNI2009b); por rótulo: gaussiana de
      0,8 voxel, marching cubes (scikit-image), Taubin 5 iterações; MNI -> Mímir pela afim abaixo; compressão meshopt
      (gltfpack). Scripts: scripts/process/mni_para_mimir.py, scripts/process/massp_nucleos.py.
    transformacao:
      descricao: "MNI2009b (mm, RAS) -> Mímir (cm): afim por ICP das superfícies subcorticais do MASSP (caudado, putâmen, pálido, tálamo, amígdala, accumbens, ventrículos) contra as do atlas (Brain for Blender, lado esquerdo e espelho)"
      matriz_4x4: [[-0.09605, -0.00026, 0.0004, -0.018583], [-0.000069, 0.006345, 0.07684, 0.31898], [-0.00267, 0.088509, 0.005612, 0.878074], [0, 0, 0, 1]]
      erro_medio_mm: 2.22
      erro_p95_mm: 5.94
    data_download: "2026-11-18"
  - id: bolachas_tronco_rm
    pasta: "models/bolachas_tronco"
    estrutura: "Cortes do tronco na RM real, 8 níveis clássicos (colículo superior ao bulbo na decussação das pirâmides): T1 de fundo (WebP) e mapa de rótulos do MASSP (PNG)"
    fonte: lusebrink2021
    fonte_adicional: [massp2, mimir]
    processamento: >-
      T1 de 250 µm (sub-yv98_ses-3512+3555+3589+3637+3681_T1w_original) registrado ao molde MNI2009b por SimpleITK
      (rígido, afim na cabeça e afim numa caixa do tronco, informação mútua; escalas 0.943, 0.930, 0.796); recorte do tronco
      reamostrado a 0,25 mm em MNI (B-spline); cortes perpendiculares ao eixo do aqueduto e do IV ventrículo, janela de 50 mm a
      0,1 mm por pixel; níveis escolhidos pelo Mímir a partir dos marcos do MASSP (a conferir). Scripts:
      scripts/process/lusebrink_mni.py, scripts/process/bolachas_tronco.py. O molde MNI só foi usado no registro.
    data_download: "2026-11-18"

  - id: vk_nervos
    arquivo: "models/vk_nervos.glb"
    estrutura: "Pares cranianos I a XII com ramos e gânglios (trigeminal, geniculado), núcleos e fibras de III, IV e VI, orelha interna (cóclea, labirinto vestibular, meato acústico interno, ossículos)"
    fonte: visible_korean
    fonte_adicional: mimir
    processamento: >-
      STL de "4. Surface models.zip" (Nervous system, Sense organs/Ear); eixos VK -> RAS (anterior = -y, superior = +z,
      direita = -x, supondo coordenadas destras); afim VK -> Mímir por ICP das estruturas do encéfalo do próprio Visible
      Korean (tálamo, caudado, putâmen, pálido, ventrículos, tronco, cerebelo) contra as do atlas (erro médio 3,04 mm,
      p95 9,29 mm); decimação quádrica (até 6 mil triângulos por nervo, 8 mil na orelha; pymeshlab); compressão meshopt
      (gltfpack). Cada arquivo do VK foi ligado a um item do atlas (tabela NERVOS em scripts/process/vk_nervos.py).
    data_download: "2026-11-18"
  - id: vk_cranio_base
    arquivo: "models/vk_cranio_base.glb"
    estrutura: "Ossos da base do crânio: esfenoide, temporal, occipital, etmoide e frontal"
    fonte: visible_korean
    processamento: >-
      STL de "Skeletal system, cranium"; mesma transformação dos nervos; decimação para cerca de 30 mil triângulos por
      osso; compressão meshopt. Mostrados transparentes no modo "Nervo + núcleo + forame".
    data_download: "2026-11-18"
  - id: vk_forames
    arquivo: "models/vk_forames.json"
    estrutura: "Posição dos forames de saída dos pares cranianos (8 por lado)"
    fonte: mimir
    fonte_adicional: visible_korean
    processamento: >-
      Calculado pelo Mímir: primeiro contato (menos de 1,5 mm) do nervo de referência de cada forame com os ossos da base,
      o mais próximo da ponte, por lado. Nome do forame e nervos que passam: Machado (tabela FORAMES em vk_nervos.py, a
      conferir). A fissura orbital superior é marcada pelo V1; III, IV e VI tocam o processo clinoide e o clivo antes dela.
    data_download: "2026-11-18"
  - id: hcp_fibras
    arquivo: "models/hcp_fibras.bin"
    estrutura: "Fibras das grandes vias (até 160 por trato e lado): projeção, comissuras, associação, pedúnculos cerebelares e vias dos núcleos da base"
    fonte: hcp1065
    fonte_adicional: mimir
    processamento: >-
      human.tt.gz (formato tt do DSI Studio, decodificado em scripts/process/hcp_vias.py); tratos agrupados nos itens do atlas
      (tabela ITENS); até 160 fibras por item e lado, sorteadas com semente fixa; reamostradas a 2 mm; MNI -> Mímir pela afim
      de mni_para_mimir.py (o HCP1065 está no ICBM 2009a); coordenadas em int16 (5 µm). Script: scripts/process/hcp_fibras.py.
      Derivado de obra CC BY-SA 4.0: distribuído sob a mesma licença.
    data_download: "2026-11-19"
  - id: hcp_fibras_indice
    arquivo: "models/hcp_fibras.json"
    estrutura: "Índice das fibras de models/hcp_fibras.bin (item, lado, início e número de pontos)"
    fonte: hcp1065
    fonte_adicional: mimir
    processamento: "Gerado junto com hcp_fibras.bin por scripts/process/hcp_fibras.py."
    data_download: "2026-11-19"
  - id: cerebelo_sereno_leve
    arquivo: "models/cerebelo_sereno_leve.glb"
    estrutura: "Córtex cerebelar com as folhas, nível de detalhe leve (cerca de 250 mil triângulos), para vistas de longe e telas de toque"
    fonte: sereno2020
    fonte_adicional: [diedrichsen2009, mimir]
    processamento: >-
      O GLB do nível folhas (com os lóbulos do SUIT em COLOR_0) simplificado pelo gltfpack para 36% dos triângulos
      (-si 0.36; a simplificação mantém vértices originais, então os rótulos continuam válidos); compressão meshopt.
    data_download: "2026-11-18"
  - id: fase5_nucleos
    arquivo: "models/fase5_nucleos.glb"
    estrutura: "Núcleos da base (caudado, putâmen, pálido externo e interno, accumbens), amígdala, claustro, hipocampo (CA1, CA2-3, giro denteado, subículo, pré-subículo), unco, fórnice, prosencéfalo basal colinérgico; núcleos do tálamo e zona incerta; núcleos do hipotálamo, corpos mamilares, trato mamilotalâmico, núcleo do leito da estria terminal, banda diagonal e núcleo basal de Meynert"
    fonte: massp2
    fonte_adicional: [allen_hra3d, neudorfer2020, mimir]
    processamento: >-
      MASSP 2.0 (maxlabel, 0,5 mm), Allen HRA 3D 2020 (annotation_full, 0,5 mm) e Neudorfer 2020 (MNI152b, 0,25 mm), todos
      em MNI 2009b; por rótulo e lado: recorte da caixa, gaussiana, marching cubes (scikit-image), Taubin 6; MNI -> Mímir
      pela afim de mni_para_mimir.py; compressão meshopt. Script: scripts/process/fase5_nucleos.py.
    data_download: "2026-11-19"
