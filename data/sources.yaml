# Manifesto de proveniência do Mímir
# Regra: nada entra no app sem uma entrada aqui. CREDITS.md e a aba Créditos do app são gerados deste arquivo
# (node scripts/gerar_creditos.mjs). Datas no formato AAAA-MM-DD.
#
# Duas listas:
#   fontes: de onde vêm os dados (uma entrada por fonte, com licença e texto de crédito exato)
#   assets: o que o app usa (arquivo ou família de geometria), cada um apontando para a(s) fonte(s)
#
# Campos de asset (prompt da reestruturação, regra 1): id, estrutura, fonte, url_original, doi, licenca,
# credito_exato, comercial_permitido, share_alike, processamento, data_download.
# Para não repetir, licenca/credito_exato/comercial_permitido/share_alike/url_original/doi vêm da fonte
# indicada em `fonte`; o gerador de créditos junta tudo. Um asset pode sobrescrever qualquer campo.
# credito_conferido: false = o texto de crédito e o DOI foram escritos de memória e precisam ser conferidos na página da fonte.

projeto:
  nome: "Mímir: Atlas 3D de Neuroanatomia"
  autor: "Gustavo de Castro"          # o prompt da reestruturação usa "Gustavo de Castro Moreira": confirmar qual nome vai nos créditos
  instituicao: "Universidade Estadual de Ponta Grossa (UEPG), curso de Medicina"
  natureza: "Projeto de extensão de autoria própria, gratuito e não comercial"
  espaco_referencia_atual: >-
    Espaço próprio do Mímir (cm; X = esquerda, Y = superior, Z = anterior), derivado das coordenadas de superfície
    do FreeSurfer do indivíduo do Brain for Blender: X = -x/10 - 0,1; giro de -10° em X; deslocamento Y +1,6 e Z +0,9;
    só o hemisfério esquerdo é convertido e o direito é o espelho (modelo simétrico). Não é o MNI ICBM152.
  espaco_referencia_alvo: "MNI ICBM152 2009c (assimétrico, 1 mm), a definir na Fase 1"

fontes:
  # ---------------- fontes já usadas no atlas atual ----------------
  - id: brain_for_blender
    nome: "Brain for Blender"
    autores: "Anderson M. Winkler"
    url_original: "https://brainder.org/brain-for-blender/"
    doi: null
    licenca: "CC BY-SA 3.0"
    comercial_permitido: true
    share_alike: true
    credito_exato: "Brain for Blender, Anderson M. Winkler (brainder.org), CC BY-SA 3.0."
    credito_conferido: true
    usado_hoje: true
    autorizada_no_prompt: false     # não está na lista de fontes autorizadas: decidir se fica ou é substituída (ver diagnóstico)
  - id: mimir
    nome: "Mímir (autoria própria)"
    autores: "Gustavo de Castro"
    url_original: "https://github.com/26011540-hub/atlas-3d-neuroanatomia"
    doi: null
    licenca: "CC BY-SA 3.0 (LICENSE atual; a decidir uma licença separada para o código e os textos, ver docs/diagnostico_fase0.md)"
    comercial_permitido: true
    share_alike: true
    credito_exato: "Mímir, autoria própria de Gustavo de Castro: textos didáticos, rótulos em português, formas esquemáticas e roteiros de estudo, com base em Ângelo Machado, Neuroanatomia Funcional, 4ª ed."
